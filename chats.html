<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk Xds</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111b21;display:flex;justify-content:center;height:100vh}
.app{width:100%;max-width:480px;background:#111b21;display:flex;flex-direction:column;position:relative}
.header{background:#202c33;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.header b{font-size:22px} .header span{color:#00a884}
.tabs{display:flex;background:#202c33}
.tab{flex:1;padding:14px;text-align:center;color:#8696a0;font-weight:700;font-size:14px;border-bottom:3px solid transparent}
.tab.ativo{color:#00a884;border-color:#00a884}
.lista{flex:1;overflow-y:auto;background:#111b21}
.item{display:flex;gap:12px;padding:12px 15px;cursor:pointer;border-bottom:1px solid #222}
.item:hover{background:#202c33}
.avatar{width:49px;height:49px;border-radius:50%;background:#00a884;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.nome{color:#e9edef;font-weight:700}
.msg{color:#8696a0;font-size:13px}
.hora{color:#8696a0;font-size:11px}
.topo{display:flex;justify-content:space-between;width:100%}
.chat-view{position:absolute;top:0;left:0;right:0;bottom:0;background:#0b141a;display:flex;flex-direction:column;z-index:10}
.chat-head{background:#202c33;padding:10px 15px;display:flex;gap:10px;align-items:center;color:#fff}
.balao{background:#202c33;color:#e9edef;padding:8px 12px;border-radius:8px;max-width:75%;font-size:14px;margin:6px 12px}
.balao.eu{background:#005c4b;align-self:flex-end}
.area-msgs{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column}
.input-bar{background:#202c33;padding:8px 12px;display:flex;gap:8px}
.input-bar input{flex:1;padding:12px 18px;border-radius:25px;border:none;background:#2a3942;color:#fff;outline:none}
.input-bar button{width:45px;height:45px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div id="tela-lista" style="display:flex;flex-direction:column;height:100vh">
    <div class="header"><b>Talk <span>Xds</span></b><span id="sair" style="cursor:pointer;font-size:13px">Sair</span></div>
    <div class="tabs"><div class="tab ativo">Conversas</div><div class="tab">Status</div><div class="tab">Chamadas</div></div>
    <div class="lista">
      <div class="item" id="abrirGeral">
        <div class="avatar">TX</div>
        <div style="flex:1"><div class="topo"><span class="nome">Chat Geral TX</span><span class="hora">agora</span></div><div class="msg">Toque para entrar 🔥</div></div>
      </div>
    </div>
  </div>

  <div id="tela-chat" class="chat-view hidden">
    <div class="chat-head"><span id="voltar" style="font-size:24px;cursor:pointer;margin-right:10px">←</span><div class="avatar" style="width:38px;height:38px">TX</div><div><div style="font-weight:700">Chat Geral TX</div><div style="font-size:12px;color:#00a884">● online</div></div></div>
    <div id="msgs" class="area-msgs"></div>
    <div class="input-bar"><input id="inputMsg" placeholder="Digite uma mensagem"><button id="btnEnviar">➤</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey:"AIzaSyDnjiFQtTu8A5vZ3NHEIl_zG9ylMKTv6b8", authDomain:"talkxds.firebaseapp.com", projectId:"talkxds", storageBucket:"talkxds.firebasestorage.app", messagingSenderId:"757013602887", appId:"1:757013602887:web:6627ff87623d698e7d8762" };
const appF=initializeApp(firebaseConfig); const auth=getAuth(appF); const db=getFirestore(appF);
onAuthStateChanged(auth,u=>{if(!u)location.href="index.html"});
document.getElementById('sair').onclick=async()=>{await signOut(auth); location.href="index.html";};
document.getElementById('abrirGeral').onclick=()=>{document.getElementById('tela-chat').classList.remove('hidden')};
document.getElementById('voltar').onclick=()=>{document.getElementById('tela-chat').classList.add('hidden')};
document.getElementById('btnEnviar').onclick=async()=>{const t=document.getElementById('inputMsg').value.trim();if(!t)return;await addDoc(collection(db,"mensagens"),{texto:t,nome:auth.currentUser.displayName||auth.currentUser.email.split('@')[0],uid:auth.currentUser.uid,hora:serverTimestamp()});document.getElementById('inputMsg').value="";};
const q=query(collection(db,"mensagens"),orderBy("hora","asc"));onSnapshot(q,s=>{const a=document.getElementById('msgs');a.innerHTML="";s.forEach(d=>{const m=d.data();const div=document.createElement('div');div.className=m.uid===auth.currentUser?.uid?"balao eu":"balao";div.innerHTML=`<b style="font-size:11px;color:#00a884">${m.nome}</b><br>${m.texto}`;a.appendChild(div);});a.scrollTop=a.scrollHeight;});
</script>
</body>
</html>
