<!DOCTYPE html>

<html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>TalkXDS - Conversas</title>

<style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; } body { background: #06060f; color: white; min-height: 100vh; } button, input { font: inherit; } button { cursor: pointer; } .app { display: flex; width: 100%; height: 100dvh; max-width: 1400px; margin: auto; background: #0b0b17; overflow: hidden; } /* MENU LATERAL */ .sidebar { width: 350px; min-width: 300px; border-right: 1px solid #24243b; display: flex; flex-direction: column; background: #101020; } .header { padding: 22px; border-bottom: 1px solid #24243b; } .logo { font-size: 27px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 15px #7c4dff; } .logo span { background: linear-gradient(90deg,#7c4dff,#ff00a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .subtitle { color: #777; font-size: 10px; letter-spacing: 3px; margin-top: 5px; } .search { padding: 15px; } .search input { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid #292945; background: #080815; color: white; outline: none; } .search input:focus { border-color: #7c4dff; } .new-chat { width: 100%; margin-top: 10px; padding: 12px; background: linear-gradient(90deg,#7c4dff,#ff00a0); border: 0; border-radius: 10px; color: white; font-weight: bold; } .section-title { padding: 12px 18px; color: #888; font-size: 11px; letter-spacing: 2px; } .chat-list { flex: 1; overflow-y: auto; } .chat-item { display: flex; align-items: center; gap: 12px; padding: 14px 17px; cursor: pointer; border-bottom: 1px solid #1c1c30; } .chat-item:hover, .chat-item.active { background: #1b1832; } .avatar { width: 45px; height: 45px; min-width: 45px; border-radius: 50%; background: linear-gradient(135deg,#7c4dff,#ff00a0); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; overflow: hidden; } .avatar img { width: 100%; height: 100%; object-fit: cover; } .chat-info { flex: 1; min-width: 0; } .chat-info strong { display: block; font-size: 14px; } .chat-info p { color: #888; font-size: 12px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .footer { padding: 15px; border-top: 1px solid #24243b; display: flex; align-items: center; gap: 10px; } .user-info { flex: 1; min-width: 0; } .user-info strong { display: block; font-size: 13px; } .user-info small { color: #888; } .logout { background: #291327; color: #ff6cba; border: 1px solid #6c2857; padding: 9px; border-radius: 9px; } /* ÁREA DAS MENSAGENS */ .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; } .chat-header { height: 75px; padding: 12px 20px; border-bottom: 1px solid #24243b; display: flex; align-items: center; gap: 12px; } .chat-header h3 { font-size: 15px; } .chat-header small { color: #777; font-size: 11px; } .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; } .message { max-width: 75%; padding: 12px 15px; border-radius: 15px; font-size: 14px; overflow-wrap: anywhere; } .sent { align-self: flex-end; background: linear-gradient(135deg,#6337d8,#a62b9d); border-bottom-right-radius: 4px; } .received { align-self: flex-start; background: #202035; border: 1px solid #30304a; border-bottom-left-radius: 4px; } .message img { max-width: 100%; max-height: 280px; display: block; border-radius: 10px; margin-top: 5px; } .message time { display: block; font-size: 10px; color: #ddd; text-align: right; margin-top: 6px; opacity: .7; } .composer { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #24243b; align-items: center; } .composer input[type="text"] { flex: 1; min-width: 0; padding: 14px; border-radius: 12px; border: 1px solid #30304a; background: #101020; color: white; outline: none; } .composer input:focus { border-color: #7c4dff; } .icon-btn { width: 43px; height: 43px; border: 0; border-radius: 12px; background: #24203d; color: white; font-size: 20px; } .send { background: linear-gradient(135deg,#7c4dff,#ff00a0); } .empty { margin: auto; text-align: center; color: #777; padding: 25px; } .empty h2 { color: white; margin-bottom: 10px; } .status { color: #777; font-size: 12px; padding: 8px 15px; } .hidden { display: none !important; } #notice { position: fixed; z-index: 20; bottom: 20px; left: 50%; transform: translateX(-50%); background: #25203d; border: 1px solid #7c4dff; color: white; padding: 12px 18px; border-radius: 12px; display: none; max-width: 90%; overflow-wrap: anywhere; } #fileInput { display: none; } @media(max-width:650px) { .sidebar { width: 100%; min-width: 0; } .main { display: none; } .app.open-chat .sidebar { display: none; } .app.open-chat .main { display: flex; width: 100%; } .back { display: block !important; } .message { max-width: 85%; } } .back { display: none; background: #24203d; border: 0; color: white; border-radius: 8px; padding: 9px 12px; } </style>

</head>

<body>

<div class="app" id="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="header"> <div class="logo">TALK <span>XDS</span></div> <div class="subtitle">NEON EDITION ⚡</div> </div>

<div class="search"> <input id="searchInput" type="email" placeholder="Pesquisar contato pelo e-mail">

<button class="new-chat" id="newChat">
  + NOVA CONVERSA
</button>


</div>

<div class="section-title">SUAS CONVERSAS</div>

<div class="chat-list" id="chatList"> <div class="empty">Carregando conversas...</div> </div>

<div class="footer">

<div class="avatar" id="myAvatar">U</div>

<div class="user-info">
  <strong id="myName">Usuário</strong>
  <small id="myEmail">Carregando...</small>
</div>

<button class="logout" id="logout">SAIR</button>


</div>

</aside>

<!-- ÁREA PRINCIPAL -->

<main class="main">

<div class="chat-header">

<button class="back" id="backButton">←</button>

<div class="avatar" id="contactAvatar">?</div>

<div>
  <h3 id="contactName">TalkXDS</h3>
  <small id="contactStatus">Suas mensagens em tempo real</small>
</div>


</div>

<div class="messages" id="messages">

<div class="empty">
  <h2>⚡ TALK XDS</h2>
  Escolha uma conversa ou comece um novo chat.
</div>


</div>

<div class="status" id="status"></div>

<div class="composer">

<button class="icon-btn" id="imageButton" title="Enviar imagem">
  📷
</button>

<input type="file" id="fileInput" accept="image/*">

<input type="text" id="messageInput"
  placeholder="Digite sua mensagem..."
  autocomplete="off">

<button class="icon-btn send" id="sendButton">
  ➤
</button>


</div>

</main>

</div>

<div id="notice"></div>

<script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"; import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"; import { getFirestore, collection, doc, getDoc, getDocs, query, where, addDoc, setDoc, updateDoc, onSnapshot, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js"; // FIREBASE CONFIG const firebaseConfig = { apiKey: "SUA_API_KEY_COMPLETA", authDomain: "talkxds.firebaseapp.com", projectId: "talkxds", storageBucket: "talkxds.firebasestorage.app", messagingSenderId: "SEU_ID_COMPLETO", appId: "SEU_APP_ID_COMPLETO" }; const appFirebase = initializeApp(firebaseConfig); const auth = getAuth(appFirebase); const db = getFirestore(appFirebase); const storage = getStorage(appFirebase); // ELEMENTOS const $ = id => document.getElementById(id); let currentUser = null; let activeChat = null; let activeContact = null; let unsubscribeChats = null; let unsubscribeMessages = null; const appElement = $("app"); // AVISOS function notify(message) { const box = $("notice"); box.textContent = message; box.style.display = "block"; setTimeout(() => { box.style.display = "none"; }, 3500); } // AVATAR function createAvatar(container, name, photo) { container.replaceChildren(); if (photo) { const img = document.createElement("img"); img.src = photo; img.alt = name || "Foto do usuário"; container.appendChild(img); } else { container.textContent = (name || "U").charAt(0).toUpperCase(); } } // AUTENTICAÇÃO onAuthStateChanged(auth, async user => { if (!user) { location.replace("index.html"); return; } currentUser = user; $("myName").textContent = user.displayName || "Usuário"; $("myEmail").textContent = user.email || ""; createAvatar( $("myAvatar"), user.displayName, user.photoURL ); loadChats(); }); // SAIR $("logout").onclick = async () => { try { if (unsubscribeChats) unsubscribeChats(); if (unsubscribeMessages) unsubscribeMessages(); await signOut(auth); location.replace("index.html"); } catch (error) { notify("Erro ao sair: " + error.message); } }; // CRIAR OU ABRIR CONVERSA async function startChat(contact) { if (!currentUser || contact.uid === currentUser.uid) { return; } try { const participants = [ currentUser.uid, contact.uid ].sort(); const chatId = participants.join("_"); const chatRef = doc(db, "chats", chatId); const chatSnapshot = await getDoc(chatRef); if (!chatSnapshot.exists()) { await setDoc(chatRef, { participants: participants, lastMessage: "", lastSenderId: "", updatedAt: serverTimestamp(), createdAt: serverTimestamp() }); } activeChat = chatId; activeContact = contact; openChat(contact); loadChats(); } catch (error) { notify("Não foi possível abrir a conversa: " + error.message); } } // PESQUISAR USUÁRIO PELO EMAIL $("newChat").onclick = async () => { if (!currentUser) return; const email = $("searchInput").value.trim().toLowerCase(); if (!email) { notify("Digite o e-mail do contato."); return; } try { const usersRef = collection(db, "users"); const userQuery = query( usersRef, where("email", "==", email) ); const result = await getDocs(userQuery); if (result.empty) { notify("Usuário não encontrado."); return; } const found = result.docs[0].data(); if (found.uid === currentUser.uid) { notify("Você não pode conversar consigo mesmo."); return; } await startChat(found); $("searchInput").value = ""; } catch (error) { notify("Erro na pesquisa: " + error.message); } }; // LISTAR CONVERSAS EM TEMPO REAL function loadChats() { if (unsubscribeChats) unsubscribeChats(); const chatsRef = collection(db, "chats"); const chatsQuery = query( chatsRef, where("participants", "array-contains", currentUser.uid) ); unsubscribeChats = onSnapshot( chatsQuery, async snapshot => { const list = []; for (const chatDoc of snapshot.docs) { const data = chatDoc.data(); const otherUid = data.participants.find( uid => uid !== currentUser.uid ); if (!otherUid) continue; try { const userSnapshot = await getDoc( doc(db, "users", otherUid) ); if (!userSnapshot.exists()) continue; list.push({ id: chatDoc.id, data: data, contact: userSnapshot.data() }); } catch (error) { console.error(error); } } list.sort((a, b) => { const dateA = a.data.updatedAt?.toMillis?.() || 0; const dateB = b.data.updatedAt?.toMillis?.() || 0; return dateB - dateA; }); renderChats(list); }, error => notify("Erro ao carregar conversas: " + error.message) ); } // DESENHAR LISTA function renderChats(list) { const container = $("chatList"); container.replaceChildren(); if (!list.length) { container.innerHTML = '<div class="empty">Você ainda não tem conversas.<br>Comece um novo chat!</div>'; return; } list.forEach(item => { const contact = item.contact; const div = document.createElement("div"); div.className = "chat-item" + (activeChat === item.id ? " active" : ""); const avatar = document.createElement("div"); avatar.className = "avatar"; createAvatar( avatar, contact.name, contact.photoURL ); const info = document.createElement("div"); info.className = "chat-info"; const name = document.createElement("strong"); name.textContent = contact.name || "Usuário"; const last = document.createElement("p"); last.textContent = item.data.lastMessage || "Comece uma conversa"; info.append(name, last); div.append(avatar, info); div.onclick = () => { activeChat = item.id; activeContact = contact; openChat(contact); renderChats(list); }; container.appendChild(div); }); } // ABRIR CONVERSA function openChat(contact) { $("contactName").textContent = contact.name || "Usuário"; $("contactStatus").textContent = contact.email || ""; createAvatar( $("contactAvatar"), contact.name, contact.photoURL ); appElement.classList.add("open-chat"); loadMessages(); } // VOLTAR NO CELULAR $("backButton").onclick = () => { appElement.classList.remove("open-chat"); }; // CARREGAR MENSAGENS EM TEMPO REAL function loadMessages() { if (unsubscribeMessages) { unsubscribeMessages(); } $("messages").replaceChildren(); const messagesRef = collection( db, "chats", activeChat, "messages" ); const messagesQuery = query( messagesRef, orderBy("createdAt", "asc") ); unsubscribeMessages = onSnapshot( messagesQuery, snapshot => { const container = $("messages"); container.replaceChildren(); snapshot.forEach(messageDoc => { const data = messageDoc.data(); renderMessage(data); }); container.scrollTop = container.scrollHeight; }, error => notify("Erro nas mensagens: " + error.message) ); } // MOSTRAR MENSAGEM function renderMessage(data) { const container = $("messages"); const div = document.createElement("div"); div.className = "message " + (data.senderId === currentUser.uid ? "sent" : "received"); if (data.text) { const text = document.createElement("div"); text.textContent = data.text; div.appendChild(text); } if (data.imageURL) { const img = document.createElement("img"); img.src = data.imageURL; img.alt = "Imagem enviada"; img.loading = "lazy"; img.onclick = () => window.open( data.imageURL, "_blank", "noopener" ); div.appendChild(img); } const time = document.createElement("time"); const date = data.createdAt?.toDate?.(); time.textContent = date ? date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "Enviando..."; div.appendChild(time); container.appendChild(div); } // ENVIAR TEXTO async function sendMessage() { if (!activeChat || !currentUser) { notify("Abra uma conversa primeiro."); return; } const input = $("messageInput"); const text = input.value.trim(); if (!text) return; input.value = ""; $("sendButton").disabled = true; try { const messagesRef = collection( db, "chats", activeChat, "messages" ); await addDoc(messagesRef, { senderId: currentUser.uid, text: text, imageURL: "", type: "text", createdAt: serverTimestamp() }); await updateDoc( doc(db, "chats", activeChat), { lastMessage: text, lastSenderId: currentUser.uid, updatedAt: serverTimestamp() } ); } catch (error) { input.value = text; notify("Erro ao enviar mensagem: " + error.message); } finally { $("sendButton").disabled = false; } } $("sendButton").onclick = sendMessage; $("messageInput").addEventListener("keydown", event => { if (event.key === "Enter") { sendMessage(); } }); // ABRIR SELETOR DE IMAGENS $("imageButton").onclick = () => { if (!activeChat) { notify("Abra uma conversa primeiro."); return; } $("fileInput").click(); }; // ENVIAR IMAGEM PELO STORAGE $("fileInput").onchange = async event => { const file = event.target.files[0]; if (!file) return; if (!file.type.startsWith("image/")) { notify("Selecione uma imagem."); event.target.value = ""; return; } if (file.size > 5 * 1024 * 1024) { notify("A imagem deve ter no máximo 5 MB."); event.target.value = ""; return; } if (!activeChat || !currentUser) return; $("status").textContent = "Enviando imagem..."; $("imageButton").disabled = true; try { const safeName = file.name.replace( /[^a-zA-Z0-9._-]/g, "_" ); const imageRef = ref( storage, `chatImages/${activeChat}/${Date.now()}_${safeName}` ); await uploadBytes(imageRef, file, { contentType: file.type }); const imageURL = await getDownloadURL(imageRef); const messagesRef = collection( db, "chats", activeChat, "messages" ); await addDoc(messagesRef, { senderId: currentUser.uid, text: "", imageURL: imageURL, type: "image", createdAt: serverTimestamp() }); await updateDoc( doc(db, "chats", activeChat), { lastMessage: "📷 Imagem", lastSenderId: currentUser.uid, updatedAt: serverTimestamp() } ); notify("Imagem enviada!"); } catch (error) { notify("Erro ao enviar imagem: " + error.message); } finally { $("status").textContent = ""; $("imageButton").disabled = false; event.target.value = ""; } }; </script>

</body> </html>
