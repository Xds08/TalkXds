<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk Xds - Chats</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="header"><div class="logo">Talk <span>Xds</span></div><div>⋮</div></div>
    <div class="tabs"><div class="ativo">Conversas</div><div>Status</div><div>Chamadas</div></div>
    <div style="padding:12px; border-bottom:1px solid #f0f2f5;">
      <div style="display:flex; gap:12px; align-items:center;">
        <div class="avatar">TX</div>
        <div><b>Chat Geral</b><br><small id="meuNome" style="color:green;">carregando...</small></div>
      </div>
    </div>
  </div>
  <div class="chat-area">
    <div class="chat-header">
      <div class="avatar">TX</div>
      <div><b>Chat Geral</b><br><small style="color:green;">● online</small></div>
    </div>
    <div class="mensagens" id="mensagens"></div>
    <div class="input-area">
      <input id="msgInput" placeholder="Mensagem" onkeydown="if(event.key==='Enter')enviar()">
      <button class="btn-enviar" onclick="enviar()">➤</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDnjiFQtTu8A5vZ3NHEIl_zG9ylMKTv6b8",
  authDomain: "talkxds.firebaseapp.com",
  projectId: "talkxds",
  storageBucket: "talkxds.firebasestorage.app",
  messagingSenderId: "757013602887",
  appId: "1:757013602887:web:6627ff87623d698e7d8762"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let userAtual=null;
onAuthStateChanged(auth, u=>{
  if(!u){ location.href="index.html"; return; }
  userAtual=u;
  document.getElementById('meuNome').innerText=u.displayName||u.email;
});
const box=document.getElementById('mensagens');
const q=query(collection(db,"mensagens"),orderBy("hora"));
onSnapshot(q, snap=>{
  box.innerHTML="";
  snap.forEach(d=>{
    const m=d.data();
    const div=document.createElement('div');
    const eu=m.uid===userAtual?.uid;
    div.className='balao '+(eu?'enviado':'recebido');
    div.innerHTML=(eu?'':`<span style="color:#1565C0; font-weight:700; font-size:12px;">${m.nome}</span><br>`) + m.texto;
    box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
});
window.enviar=async()=>{
  const inp=document.getElementById('msgInput');
  if(!inp.value.trim()||!userAtual)return;
  await addDoc(collection(db,"mensagens"),{texto:inp.value,nome:userAtual.displayName||userAtual.email.split('@')[0],uid:userAtual.uid,hora:serverTimestamp()});
  inp.value="";
}
</script>
</body>
</html>
