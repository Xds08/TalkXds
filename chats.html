<!DOCTYPE html>

<html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>TalkXDS - Conversas</title>

<style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; } body { background: #06060f; color: white; min-height: 100vh; } button, input { font: inherit; } button { cursor: pointer; } .app { display: flex; width: 100%; height: 100dvh; max-width: 1400px; margin: auto; background: #0b0b17; overflow: hidden; } .sidebar { width: 350px; min-width: 300px; border-right: 1px solid #24243b; display: flex; flex-direction: column; background: #101020; } .header { padding: 22px; border-bottom: 1px solid #24243b; } .logo { font-size: 27px; font-weight: 900; letter-spacing: 2px; } .logo span { background: linear-gradient(90deg,#7c4dff,#ff00a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .subtitle { color: #777; font-size: 10px; letter-spacing: 3px; margin-top: 5px; } .search { padding: 15px; } .search input { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid #292945; background: #080815; color: white; } .new-chat { width: 100%; margin-top: 10px; padding: 12px; background: linear-gradient(90deg,#7c4dff,#ff00a0); border: 0; border-radius: 10px; color: white; font-weight: bold; } .section-title { padding: 12px 18px; color: #888; font-size: 11px; letter-spacing: 2px; } .chat-list { flex: 1; overflow-y: auto; } .chat-item { display: flex; align-items: center; gap: 12px; padding: 14px 17px; cursor: pointer; border-bottom: 1px solid #1c1c30; } .chat-item:hover, .chat-item.active { background: #1b1832; } .avatar { width: 45px; height: 45px; min-width: 45px; border-radius: 50%; background: linear-gradient(135deg,#7c4dff,#ff00a0); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; overflow: hidden; } .avatar img { width: 100%; height: 100%; object-fit: cover; } .chat-info { flex: 1; min-width: 0; } .chat-info strong { display: block; font-size: 14px; } .chat-info p { color: #888; font-size: 12px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .footer { padding: 15px; border-top: 1px solid #24243b; display: flex; align-items: center; gap: 10px; } .user-info { flex: 1; min-width: 0; } .user-info strong { display: block; font-size: 13px; } .user-info small { color: #888; } .logout { background: #291327; color: #ff6cba; border: 1px solid #6c2857; padding: 9px; border-radius: 9px; } .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; } .chat-header { height: 75px; padding: 12px 20px; border-bottom: 1px solid #24243b; display: flex; align-items: center; gap: 12px; } .chat-header h3 { font-size: 15px; } .chat-header small { color: #777; font-size: 11px; } .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; } .message { max-width: 75%; padding: 12px 15px; border-radius: 15px; font-size: 14px; overflow-wrap: anywhere; } .sent { align-self: flex-end; background: linear-gradient(135deg,#6337d8,#a62b9d); } .received { align-self: flex-start; background: #202035; border: 1px solid #30304a; } .message img { max-width: 100%; max-height: 280px; display: block; border-radius: 10px; margin-top: 5px; } .message time { display: block; font-size: 10px; color: #ddd; text-align: right; margin-top: 6px; } .composer { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #24243b; align-items: center; } .composer input[type="text"] { flex: 1; min-width: 0; padding: 14px; border-radius: 12px; border: 1px solid #30304a; background: #101020; color: white; } .icon-btn { width: 43px; height: 43px; border: 0; border-radius: 12px; background: #24203d; color: white; font-size: 20px; } .send { background: linear-gradient(135deg,#7c4dff,#ff00a0); } .empty { margin: auto; text-align: center; color: #777; padding: 25px; } .empty h2 { color: white; margin-bottom: 10px; } .status { color: #777; font-size: 12px; padding: 8px 15px; } #notice { position: fixed; z-index: 20; bottom: 20px; left: 50%; transform: translateX(-50%); background: #25203d; border: 1px solid #7c4dff; color: white; padding: 12px 18px; border-radius: 12px; display: none; max-width: 90%; } #fileInput { display: none; } .back { display: none; background: #24203d; border: 0; color: white; border-radius: 8px; padding: 9px 12px; } @media(max-width:650px) { .sidebar { width: 100%; min-width: 0; } .main { display: none; } .app.open-chat .sidebar { display: none; } .app.open-chat .main { display: flex; width: 100%; } .back { display: block; } .message { max-width: 85%; } }
