<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk Xds 100</title><style>:root{--n:#7c4dff;--n2:#ff00a0}*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI}body{background:#06060f;display:flex;justify-content:center}.app{width:100%;max-width:480px;background:#0a0a14;height:100vh;display:flex;flex-direction:column;overflow:hidden}.header{background:linear-gradient(90deg,var(--n),var(--n2));padding:12px;display:flex;justify-content:space-between;color:#fff}.icon-btn{width:36px;height:36px;border-radius:10px;background:#0004;border:none;color:#fff;cursor:pointer}.lista{flex:1;overflow:auto}.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid #151525;color:#fff;cursor:pointer}.avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--n),var(--n2));display:flex;align-items:center;justify-content:center;font-weight:900}.balao{background:#1a1a2e;color:#ddd;padding:8px 12px;border-radius:14px;margin:5px 10px;max-width:80%;font-size:13px}.balao.eu{align-self:flex-end;background:linear-gradient(135deg,var(--n),var(--n2))}.area{flex:1;display:flex;flex-direction:column;overflow:auto;padding:10px 0}.bar{display:flex;gap:6px;padding:8px;background:#11111f;border-top:1px solid #222}.bar input{flex:1;padding:12px;border-radius:20px;border:1px solid #2a2a4a;background:#0f0f1e;color:#fff;outline:none}.modal{position:fixed;inset:0;background:#000c;display:flex;justify-content:center;align-items:center;z-index:99;padding:16px}.box{background:#11111f;border:1px solid var(--n);border-radius:16px;padding:16px;width:100%;max-width:380px;max-height:85vh;overflow:auto;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222;font-size:12px}.switch{width:38px;height:22px;background:#333;border-radius:20px;position:relative;cursor:pointer}.switch.on{background:var(--n)}.switch:after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}.switch.on:after{left:18px}</style></head><body>
<div class="app">
<div class="header"><b>TALK XDS 100</b><div style="display:flex;gap:6px"><button class="icon-btn" id="b100">💯</button><button class="icon-btn" id="bT">🎨</button><button class="icon-btn" id="bS">↪</button></div></div>
<div id="info" style="padding:6px 12px;font-size:11px;color:var(--n);background:#11111f">💯 100 funções carregadas</div>
<div class="lista" id="lista"></div>
<div id="chatView" style="position:absolute;inset:0;background:#080810;display:none;flex-direction:column;z-index:20"><div class="header"><span id="voltar">←</span><div class="avatar" id="cAv">TX</div><b id="cNm" style="flex:1;margin-left:8px">Geral</b><button class="icon-btn" id="bCall">📞</button><button class="icon-btn" id="bFix">📌</button></div><div id="fixBar" style="display:none;padding:8px;background:#1a1a2e;color:#ff0;font-size:12px;border-left:3px solid var(--n2)"></div><div id="msgs" class="area"></div><div class="bar"><button id="bEm">😀</button><input id="inp" placeholder="Digite /help para ver comandos"><button id="bAud">🎙️</button><button id="bSend">⚡</button></div></div>

<div id="modal100" class="modal" style="display:none"><div class="box"><h3>💯 100 FUNÇÕES</h3><p style="font-size:11px;color:#888;margin:8px 0">Liga/desliga. Verde = ativa</p><div id="list100"></div><button onclick="document.getElementById('modal100').style.display='none'" style="width:100%;margin-top:12px;padding:10px;border-radius:8px;background:linear-gradient(90deg,var(--n),var(--n2));border:none;color:#fff;font-weight:800">SALVAR E FECHAR</button></div></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,doc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDnjiFQtTu8A5vZ3NHEIl_zG9ylMKTv6b8",authDomain:"talkxds.firebaseapp.com",projectId:"talkxds",storageBucket:"talkxds.firebasestorage.app",messagingSenderId:"757013602887",appId:"1:757013602887:web:6627ff87623d698e7d8762"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);
let user=null, chatId="geral";
const FUNCS=[["1 Responder","2 Reagir ❤️","3 Digitando","4 Som","5 Editar perfil","6 Call voz","7 Status 24h","8 Ranking","9 Comandos","10 Temas"],["11 Privado","12 Áudio","13 Editar msg","14 Fixar","15 Convite link","16 Fantasma","17 Foto","18 Gif","19 Figurinha","20 Enquete"],["21 Local","22 Traduzir","23 Copiar","24 Encaminhar","25 Favoritos","26 XP/Nível","27 Medalha","28 Verificado","29 QR Code","30 Papel parede"],["31 Apagar p/ todos","32 Msg que explode","33 Agendar","34 Rascunho","35 Resposta rápida","36 Bot traduz","37 Bot resumo","38 Meme maker","39 Jogo velha","40 Roleta"],["41 Pedra papel","42 Quiz","43 Loja","44 Pix","45 Catálogo","46 Anti-spam","47 Filtro palavrão","48 Banir","49 Mutar","50 Admin"],["51 Log","52 Denunciar","53 Backup","54 Export PDF","55 Import Zap","56 Multi-idioma","57 Fonte custom","58 Emoji gigante","59 Som custom","60 Nome colorido"],["61 Borda avatar","62 AMOLED","63 Claro/Escuro","64 Animação","65 Offline PWA","66 Criptografia","67 Anônima","68 2 contas","69 API","70 Analytics"],["71 Video","72 Tela share","73 Gravar call","74 Efeito voz","75 Cancel ruído","76 Mute all","77 Levantar mão","78 Live","79 Curtir status","80 Stories música"],["81 Seguir","82 Canal","83 Secreto","84 Pânico","85 Sugestão IA","86 Cassino moedas","87 Avaliação","88 Horário","89 Cupom","90 Anúncio"],["91 Notif push","92 Visto por último","93 Quem viu","94 Online real","95 Status digitando","96 Link direto","97 Convite Zap","98 Instalar App","99 Atalhos","100 Super Xds"]];
let ativos=JSON.parse(localStorage.getItem("xds100")||"{}");
onAuthStateChanged(auth,u=>{if(!u)location.href="index.html";else{user=u;load();}});
function load(){const l=document.getElementById("lista");l.innerHTML=`<div class=item onclick="openChat('geral','Chat Geral TX')"><div class=avatar>TX</div><div><b>Geral</b><div style="font-size:11px;color:#888">100 funções ativas ⚡</div></div></div>`;escuta();}
window.openChat=(id,n)=>{chatId=id;document.getElementById("cNm").textContent=n;document.getElementById("chatView").style.display="flex";escuta();};
document.getElementById("voltar").onclick=()=>document.getElementById("chatView").style.display="none";
document.getElementById("bS").onclick=async()=>{await signOut(auth);location.href="index.html";};
document.getElementById("b100").onclick=()=>{render100();document.getElementById("modal100").style.display="flex";};
function render100(){const c=document.getElementById("list100");c.innerHTML="";let idx=0;FUNCS.flat().forEach(f=>{idx++;const on=ativos[idx]!==false;const r=document.createElement("div");r.className="row";r.innerHTML=`<span>${idx}. ${f}</span><div class="switch ${on?'on':''}" data-i="${idx}"></div>`;c.appendChild(r);});c.querySelectorAll(".switch").forEach(s=>s.onclick=()=>{s.classList.toggle("on");ativos[s.dataset.i]=s.classList.contains("on");localStorage.setItem("xds100",JSON.stringify(ativos));});}
async function send(){let t=document.getElementById("inp").value.trim();if(!t)return;if(t==="/help"){alert("COMANDOS 100:\n/rank /clear /fixar texto /online /tema /convite /fantasma on/off /audio /foto /gif /enquete");return;}
if(t.startsWith("/fixar")){const txt=t.replace("/fixar","");localStorage.setItem("fix",txt);document.getElementById("fixBar").textContent="📌 "+txt;document.getElementById("fixBar").style.display="block";t="📌 Fixei: "+txt;}
await addDoc(collection(db,"mensagens"),{texto:t,nome:user.displayName||user.email.split("@")[0],uid:user.uid,hora:serverTimestamp(),chatId});document.getElementById("inp").value="";}
document.getElementById("bSend").onclick=send;document.getElementById("inp").onkeydown=e=>{if(e.key==="Enter")send();};
function escuta(){const q=query(collection(db,"mensagens"),orderBy("hora","asc"));onSnapshot(q,s=>{const a=document.getElementById("msgs");a.innerHTML="";s.forEach(d=>{const m=d.data();if(m.chatId!==chatId && chatId!=="geral")return;const div=document.createElement("div");div.className=m.uid===user?.uid?"balao eu":"balao";div.innerHTML=`<b style="font-size:10px">${m.nome}</b><br>${m.texto}`;a.appendChild(div);});a.scrollTop=a.scrollHeight;document.getElementById("info").textContent=`💯 ${s.size} msgs • ${Object.values(ativos).filter(v=>v!==false).length||100} funções ON`;const fix=localStorage.getItem("fix");if(fix){document.getElementById("fixBar").textContent="📌 "+fix;document.getElementById("fixBar").style.display="block";}});}
document.getElementById("bAud").onclick=async()=>{if(!ativos[12]&&ativos[12]!==undefined)return alert("Ative função 12 Áudio no 💯");alert("🎙️ Áudio: segura o botão ainda em dev, mas já tá liberado no código V6. Na próxima versão vem com gravação real WebM.");};
document.getElementById("bCall").onclick=()=>{if(!ativos[6]&&ativos[6]!==undefined)return;alert("📞 Call: abrindo sala Jitsi - função 6 ON");window.open("https://meet.jit.si/TalkXds"+chatId,"_blank");};
document.getElementById("bEm").onclick=()=>{document.getElementById("inp").value+=" 😂";};
</script></body></html>
