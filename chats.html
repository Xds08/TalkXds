<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk Xds</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="header">
      <div class="logo">Talk <span>Xds</span></div>
      <div>🔍 📹 ⋮</div>
    </div>
    <div class="tabs">
      <div class="ativo">Chats</div>
      <div>Contatos</div>
      <div>Calls</div>
    </div>
    <div class="search"><input id="busca" placeholder="Buscar chats..."></div>
    <div id="listaContatos">
      <div class="contato" onclick="abrirChat('geral')">
        <div class="avatar">TX</div>
        <div><b>Chat Geral Talk Xds</b><br><small>Entra ai galera!</small></div>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <div class="avatar">TX</div>
      <div><b>Chat Geral</b><br><small style="color:green;">Online</small></div>
    </div>
    <div class="mensagens" id="mensagens"></div>
    <div class="input-area">
      <input id="msgInput" placeholder="Digite uma mensagem...">
      <button class="btn-enviar" onclick="enviar()">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY_DO_xdstalk-c597b",
  authDomain: "xdstalk-c597b.firebaseapp.com",
  projectId: "xdstalk-c597b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const mensagensDiv = document.getElementById('mensagens');

const q = query(collection(db, "mensagens"), orderBy("hora"));
onSnapshot(q, (snap)=>{
  mensagensDiv.innerHTML = "";
  snap.forEach(doc=>{
    const m = doc.data();
    const div = document.createElement('div');
    div.className = 'balao ' + (m.uid === auth.currentUser?.uid ? 'enviado' : 'recebido');
    div.innerHTML = `<b>${m.nome||''}</b><br>${m.texto}`;
    mensagensDiv.appendChild(div);
  });
  mensagensDiv.scrollTop = mensagensDiv.scrollHeight;
});

window.enviar = async ()=>{
  const input = document.getElementById('msgInput');
  if(!input.value) return;
  await addDoc(collection(db, "mensagens"), {
    texto: input.value,
    nome: auth.currentUser?.email || 'Anon',
    uid: auth.currentUser?.uid || 'anon',
    hora: serverTimestamp()
  });
  input.value = "";
}
</script>
</body>
</html>
