
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>XdsTalk</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AizaSyD",
  authDomain: "xdstalk.firebaseapp.com",
  projectId: "xdstalk",
  storageBucket: "xdstalk.firebasestorage.app",
  messagingSenderId: "COLA AQUI SEU SENDER ID",
  appId: "COLA AQUI SEU APP ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.loginComGoogle = () => signInWithPopup(auth, provider);
window.sair = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  const login = document.getElementById("loginBox");
  const appDiv = document.getElementById("appBox");
  if (user) {
    login.style.display="none";
    appDiv.style.display="block";
    document.getElementById("foto").src = user.photoURL;
    document.getElementById("nome").innerText = user.displayName;
  } else {
    login.style.display="block";
    appDiv.style.display="none";
  }
});
</script>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0a0a14;font-family:system-ui;color:#fff;padding:16px}
.card{width:100%;max-width:380px;background:#151528;border:2px solid #24244a;border-radius:24px;padding:28px;box-shadow:0 20px 60px #000a}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px} .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#ff2e63,#8b5cf6);border-radius:12px;display:grid;place-items:center;font-size:22px} .logo h1{margin:0;font-size:26px;letter-spacing:-1px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-weight:700;cursor:pointer} .btn-google{background:#fff;color:#111;display:flex;gap:10px;justify-content:center;align-items:center} .btn-google img{width:20px}
.top{display:flex;align-items:center;gap:12px} .top img{width:48px;height:48px;border-radius:50%} .top b{font-size:16px} .sair{margin-top:20px;background:#24244a;color:#fff}
.chat{background:#0f0f23;border-radius:16px;padding:14px;margin-top:18px;border:1px solid #24244a;color:#666;text-align:center;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="loginBox">
    <div class="logo"><div class="logo-icon">💬</div><h1>XdsTalk</h1></div>
    <p style="color:#8a8aaa;margin:0 0 20px">Entre e converse com seus amigos</p>
    <button class="btn btn-google" onclick="loginComGoogle()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">Entrar com Google</button>
  </div>
  <div id="appBox" style="display:none">
    <div class="top"><img id="foto"><div><b id="nome"></b><br><span style="color:#8a8aaa;font-size:13px">online</span></div></div>
    <div class="chat">Chat em breve aqui...</div>
    <button class="btn sair" onclick="sair()">Sair</button>
  </div>
</div>
</body>
</html>
