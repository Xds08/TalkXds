<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk Xds</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body class="login-body">
  <div class="login-box">
    <div class="logo-big">Talk <span>Xds</span></div>
    <p>Bem-vindo! Crie sua conta</p>
    <input id="nome" placeholder="Seu nome">
    <input id="email" type="email" placeholder="Seu e-mail">
    <input id="senha" type="password" placeholder="Sua senha">
    <button id="btnCriar">CRIAR CONTA</button>
    <button id="btnEntrar" class="outline">JÁ TENHO CONTA</button>
    <div id="msg" style="color:red; font-size:13px; margin-top:5px;"></div>
  </div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDnjiFQtTu8A5vZ3NHEIl_zG9ylMKTv6b8",
  authDomain: "talkxds.firebaseapp.com",
  projectId: "talkxds",
  storageBucket: "talkxds.firebasestorage.app",
  messagingSenderId: "757013602887",
  appId: "1:757013602887:web:6627ff87623d698e7d8762"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const msg = document.getElementById('msg');

document.getElementById('btnCriar').onclick = async()=>{
  try{
    const nome=document.getElementById('nome').value;
    const email=document.getElementById('email').value;
    const senha=document.getElementById('senha').value;
    if(!nome||!email||!senha){ msg.innerText="Preencha tudo!"; return; }
    const cred = await createUserWithEmailAndPassword(auth,email,senha);
    await updateProfile(cred.user,{displayName:nome});
    location.href="chats.html";
  }catch(e){ msg.innerText=e.message; }
}
document.getElementById('btnEntrar').onclick = async()=>{
  try{
    const email=document.getElementById('email').value;
    const senha=document.getElementById('senha').value;
    await signInWithEmailAndPassword(auth,email,senha);
    location.href="chats.html";
  }catch(e){ msg.innerText=e.message; }
}
</script>
</body>
</html>
