
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XdsTalk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif;margin:0}
body{background:#0f0f0f;color:#fff;height:100vh}
#loginScreen{height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top, #1a1a2e, #0f0f0f)}
.container{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);padding:35px;border-radius:24px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{text-align:center;margin-bottom:25px}
.logo h1{font-size:32px;font-weight:800;background:linear-gradient(90deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:#aaa;font-size:13px;margin-top:5px}
.input-group{position:relative;margin:12px 0}
.input-group input{width:100%;padding:14px 14px 14px 42px;background:#151515;border:1px solid #2a2a2a;border-radius:12px;color:#fff;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.btn-primary{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000}
.btn-secondary{background:#222;color:#fff;border:1px solid #333}
.link{color:#00ff88;font-size:12px;text-align:center;display:block;margin-top:15px;cursor:pointer;text-decoration:underline;background:none;border:none;width:100%}
#msg{text-align:center;margin-top:16px;font-size:13px;min-height:18px}
.success{color:#00ff88}.error{color:#ff5a5a}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#555;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#222}

/* CHAT */
#chatScreen{display:none;height:100vh;flex-direction:column}
.header{padding:15px;background:#1a1a1a;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.header h2{background:linear-gradient(90deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#0f0f0f}
.bubble{padding:10px 14px;border-radius:18px;max-width:75%;font-size:14px}
.mine{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.theirs{background:#222;color:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.input-area{display:flex;padding:12px;background:#1a1a1a;border-top:1px solid #222;gap:10px}
.input-area input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#0f0f0f;color:#fff;outline:none}
.input-area button{padding:12px 18px;border-radius:20px;border:none;background:linear-gradient(90deg,#00ff88,#00d4ff);font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div id="loginScreen">
<div class="container">
<div class="logo"><h1>XdsTalk</h1><p>Converse com o mundo</p></div>
<div class="input-group"><input type="email" id="email" placeholder="Seu email"></div>
<div class="input-group"><input type="password" id="password" placeholder="Sua senha"></div>
<button class="btn btn-primary" id="btnCriar">Criar minha conta</button>
<div class="divider">ou</div>
<button class="btn btn-secondary" id="btnEntrar">Já tenho conta - Entrar</button>
<button class="link" id="btnReset">Esqueci minha senha</button>
<div id="msg"></div>
</div>
</div>

<div id="chatScreen">
<div class="header">
<h2>XdsTalk</h2>
<div><span id="userEmail" style="font-size:12px;color:#aaa"></span> <button id="btnSair" style="margin-left:10px;background:#222;color:#fff;border:1px solid #333;padding:6px 10px;border-radius:8px;cursor:pointer">Sair</button></div>
</div>
<div class="messages" id="messages"></div>
<div class="input-area">
<input type="text" id="msgInput" placeholder="Digite uma mensagem...">
<button id="btnEnviar">Enviar</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8UtD8cNIAeqVeHbeZVDmxVzcEo9ZNUN4",
  authDomain: "xdstalk-c597b.firebaseapp.com",
  projectId: "xdstalk-c597b",
  storageBucket: "xdstalk-c597b.firebasestorage.app",
  messagingSenderId: "852750985311",
  appId: "1:852750985311:web:e659289d031e5f1a3153ea",
  measurementId: "G-WYM9LV0TXC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const msg = document.getElementById('msg');
function showMsg(t,c){msg.className=c;msg.innerText=t}

const loginScreen = document.getElementById('loginScreen');
const chatScreen = document.getElementById('chatScreen');

onAuthStateChanged(auth, (user)=>{
  if(user){
    loginScreen.style.display='none';
    chatScreen.style.display='flex';
    document.getElementById('userEmail').innerText = user.email;
    carregarMensagens();
  } else {
    loginScreen.style.display='flex';
    chatScreen.style.display='none';
  }
});

document.getElementById('btnCriar').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  if(!email||!pass) return showMsg('Preencha email e senha','error');
  showMsg('Criando...','');
  try { await createUserWithEmailAndPassword(auth, email, pass); showMsg('Conta criada!','success'); } 
  catch (e) { showMsg(e.code=='auth/email-already-in-use' ? 'Já existe, clica em Entrar' : e.message,'error'); }
};
document.getElementById('btnEntrar').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  if(!email||!pass) return showMsg('Preencha email e senha','error');
  showMsg('Entrando...','');
  try { await signInWithEmailAndPassword(auth, email, pass); } 
  catch (e) { showMsg('Email ou senha errados','error'); }
};
document.getElementById('btnReset').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if(!email) return showMsg('Digite seu email','error');
  await sendPasswordResetEmail(auth, email);
  showMsg('Email de recuperação enviado!','success');
};
document.getElementById('btnSair').onclick = ()=> signOut(auth);

async function carregarMensagens(){
  const q = query(collection(db, "mensagens"), orderBy("data"));
  onSnapshot(q, (snap)=>{
    const div = document.getElementById('messages');
    div.innerHTML='';
    snap.forEach(doc=>{
      const d = doc.data();
      const b = document.createElement('div');
      b.className = 'bubble ' + (d.email === auth.currentUser.email ? 'mine' : 'theirs');
      b.innerHTML = `<b style="font-size:11px;display:block;opacity:0.7">${d.email}</b>${d.texto}`;
      div.appendChild(b);
    });
    div.scrollTop = div.scrollHeight;
  });
}

document.getElementById('btnEnviar').onclick = async ()=>{
  const texto = document.getElementById('msgInput').value.trim();
  if(!texto) return;
  await addDoc(collection(db, "mensagens"), { texto, email: auth.currentUser.email, data: serverTimestamp() });
  document.getElementById('msgInput').value='';
};
document.getElementById('msgInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('btnEnviar').click(); });
</script>
</body>
</html>
