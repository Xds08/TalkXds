
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkXds</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1621;color:#f2f5f8;font-family:Arial,sans-serif}
button,input,textarea{font:inherit;border-radius:8px;padding:11px}
button{border:0;background:#00b887;color:#062b23;font-weight:bold;cursor:pointer}
input,textarea{background:#172431;color:white;border:1px solid #344555;width:100%;margin:5px 0 10px}
.screen{display:none}
.screen.active{display:flex}
#auth{min-height:100dvh;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#192734;padding:22px;border-radius:15px}
.logo{text-align:center;font-size:30px;color:#00d09b;font-weight:bold}
#app{height:100dvh}
aside{width:300px;max-width:42%;padding:12px;background:#192734;overflow:auto}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#header{padding:14px;background:#192734}
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{background:#243647;padding:10px;border-radius:10px;max-width:85%;overflow-wrap:anywhere;align-self:flex-start}
.msg.mine{align-self:flex-end;background:#075e4d}
.msg img,.msg video{max-width:100%;max-height:260px}
.msg audio{max-width:100%}
#compose{display:flex;gap:5px;padding:8px;background:#192734;align-items:center}
#compose input{margin:0;min-width:0}
#compose button{padding:10px}
.user{padding:12px;border-bottom:1px solid #344555;cursor:pointer;overflow-wrap:anywhere}
.user:hover{background:#243647}
small{color:#a8bac8}
#status{white-space:pre-wrap}
@media(max-width:650px){
#app.active{flex-direction:column}
aside{width:100%;max-width:none;max-height:43%;flex-shrink:0}
#main{flex:1;min-height:0}
}
</style>
</head>
<body>

<section id="auth" class="screen active">
<div class="card">
<div class="logo">TalkXds</div>
<h2 id="authTitle">Entrar</h2>
<div id="extra" style="display:none">
<label>Nome</label><input id="name" placeholder="Seu nome">
<label>Telefone</label><input id="phone" placeholder="Telefone (opcional)">
</div>
<label>E-mail</label><input id="email" type="email" autocomplete="email">
<label>Senha</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" style="width:100%">Entrar</button>
<p><button id="toggle" style="width:100%">Criar conta</button></p>
<p><button id="forgot" style="width:100%">Recuperar senha</button></p>
<p><button id="google" style="width:100%">Entrar com Google</button></p>
<div id="status"></div>
</div>
</section>

<section id="app" class="screen">
<aside>
<div class="logo">TalkXds</div>
<p id="myEmail"></p>
<label>Meu nome</label><input id="editName" placeholder="Seu nome">
<button id="saveProfile" style="width:100%">Salvar perfil</button>
<p><label>Fundo das conversas</label><input id="wallpaper" type="file" accept="image/*"></p>
<hr>
<label>Procurar pessoas</label>
<input id="search" placeholder="Nome ou e-mail">
<div id="users"></div>
<hr>
<button id="logout" style="width:100%">Sair da conta</button>
</aside>
<div id="main">
<div id="header">Selecione uma pessoa para conversar</div>
<div id="messages"><p>Bem-vindo ao TalkXds!</p></div>
<div id="compose">
<button id="attach" title="Enviar arquivo">📎</button>
<input id="file" type="file" accept="image/*,video/*,audio/*" hidden>
<button id="record" title="Gravar áudio">🎙️</button>
<input id="message" placeholder="Digite uma mensagem..." disabled>
<button id="send" disabled>Enviar</button>
</div>
</div>
</section>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://ohxjcxkhayugkxffgync.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_i5Hr0p_LCgVzFhtIB8PQQg_Z1fTuM9s';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
let me=null, peer=null, signup=false, recording=null, recorder=null, chunks=[];

function status(t){$('status').textContent=t}
function screen(id){$('auth').classList.remove('active');$('app').classList.remove('active');$(id).classList.add('active')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('toggle').onclick=()=>{
 signup=!signup;
 $('extra').style.display=signup?'block':'none';
 $('authTitle').textContent=signup?'Criar conta':'Entrar';
 $('loginBtn').textContent=signup?'Cadastrar':'Entrar';
 $('toggle').textContent=signup?'Já tenho conta':'Criar conta';
 status('');
};

$('loginBtn').onclick=async()=>{
 const email=$('email').value.trim();
 const password=$('password').value;
 if(!email||!password){status('Digite seu e-mail e sua senha.');return}
 status('Aguarde...');
 try{
  let r;
  if(signup){
   r=await sb.auth.signUp({email,password,options:{data:{
    display_name:$('name').value.trim(),
    phone:$('phone').value.trim()
   }}});
  }else{
   r=await sb.auth.signInWithPassword({email,password});
  }
  if(r.error)throw r.error;
  if(signup&&!r.data.session){
   status('Cadastro iniciado! Confira seu e-mail para confirmar a conta.');
   return;
  }
  if(r.data.user)await start(r.data.user);
 }catch(e){status('Erro: '+e.message)}
};

$('forgot').onclick=async()=>{
 const email=$('email').value.trim();
 if(!email){status('Digite seu e-mail primeiro.');return}
 const {error}=await sb.auth.resetPasswordForEmail(email,{
  redirectTo:location.origin+location.pathname
 });
 status(error?'Erro: '+error.message:'Se o e-mail estiver cadastrado, você receberá as instruções de recuperação. Confira também o spam.');
};

$('google').onclick=async()=>{
 const {error}=await sb.auth.signInWithOAuth({
  provider:'google',
  options:{redirectTo:location.origin+location.pathname}
 });
 if(error)status('Erro: '+error.message);
};

async function start(user){
 me=user;
 screen('app');
 $('myEmail').textContent=user.email||'';
 $('editName').value=user.user_metadata?.display_name||'';
 await syncProfile();
 await loadUsers();
}

async function syncProfile(){
 if(!me)return;
 const display_name=$('editName').value.trim()||me.user_metadata?.display_name||me.email?.split('@')[0]||'Usuário';
 const {error}=await sb.from('profiles').upsert({
  id:me.id,email:me.email,display_name,
  phone:me.user_metadata?.phone||''
 },{onConflict:'id'});
 if(error)console.warn('Perfil:',error.message);
}

$('saveProfile').onclick=async()=>{
 const display_name=$('editName').value.trim();
 if(!display_name){alert('Digite seu nome.');return}
 const {error}=await sb.from('profiles').upsert({
  id:me.id,email:me.email,display_name,
  phone:me.user_metadata?.phone||''
 },{onConflict:'id'});
 if(error){alert('Não foi possível salvar: '+error.message);return}
 const {error:e}=await sb.auth.updateUser({data:{display_name}});
 if(e)console.warn(e.message);
 alert('Perfil salvo!');
 await loadUsers();
};

async function loadUsers(){
 if(!me)return;
 const q=$('search').value.trim();
 let req=sb.from('profiles')
  .select('id,email,display_name,avatar_url')
  .neq('id',me.id).limit(50);
 if(q)req=req.or(`display_name.ilike.%${q}%,email.ilike.%${q}%`);
 const {data,error}=await req;
 if(error){$('users').textContent='Erro ao carregar usuários: '+error.message;return}
 $('users').innerHTML='';
 for(const u of data||[]){
  const el=document.createElement('div');
  el.className='user';
  el.innerHTML='<strong>'+esc(u.display_name||'Usuário')+'</strong><br><small>'+esc(u.email||'')+'</small>';
  el.onclick=()=>openChat(u);
  $('users').appendChild(el);
 }
 if(!data?.length)$('users').textContent='Nenhum usuário encontrado.';
}
$('search').oninput=()=>loadUsers();

async function openChat(u){
 peer=u;
 $('header').innerHTML='<button id="back" style="float:right">Voltar</button><strong>'+esc(u.display_name||u.email)+'</strong><br><small>'+esc(u.email)+'</small>';
 $('back').onclick=()=>{peer=null;$('header').textContent='Selecione uma pessoa para conversar';$('message').disabled=true;$('send').disabled=true;$('messages').innerHTML='Selecione uma conversa.'};
 $('message').disabled=false;
 $('send').disabled=false;
 await loadMessages();
}

async function loadMessages(){
 if(!me||!peer)return;
 const {data,error}=await sb.from('messages')
 .select('*')
 .or(`and(sender_id.eq.${me.id},receiver_id.eq.${peer.id}),and(sender_id.eq.${peer.id},receiver_id.eq.${me.id})`)
 .order('created_at',{ascending:true}).limit(200);
 if(error){$('messages').textContent='Erro ao carregar mensagens: '+error.message;return}
 $('messages').innerHTML='';
 for(const m of data||[]){
  const mine=m.sender_id===me.id;
  const el=document.createElement('div');
  el.className='msg'+(mine?' mine':'');
  if(m.body)el.append(document.createTextNode(m.body));
  if(m.media_path){
   const {data:urlData,error:urlError}=await sb.storage.from('chat-media').createSignedUrl(m.media_path,300);
   if(!urlError&&urlData?.signedUrl){
    let media;
    if((m.media_type||'').startsWith('image/'))media=document.createElement('img');
    else if((m.media_type||'').startsWith('video/'))media=document.createElement('video');
    else if((m.media_type||'').startsWith('audio/'))media=document.createElement('audio');
    else{media=document.createElement('a');media.textContent='Abrir arquivo';media.target='_blank'}
    media.src=urlData.signedUrl;
    if(media.tagName==='VIDEO'||media.tagName==='AUDIO')media.controls=true;
    el.appendChild(document.createElement('br'));
    el.appendChild(media);
   }
  }
  const time=document.createElement('small');
  time.textContent=new Date(m.created_at).toLocaleString('pt-BR');
  el.appendChild(document.createElement('br'));el.appendChild(time);
  $('messages').appendChild(el);
 }
 $('messages').scrollTop=$('messages').scrollHeight;
}

async function sendMessage(body='',file=null){
 if(!me||!peer)return;
 if(!body.trim()&&!file)return;
 let media_path=null,media_type=null;
 if(file){
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  media_path=`${me.id}/${crypto.randomUUID()}-${safeName}`;
  media_type=file.type||'application/octet-stream';
  const {error}=await sb.storage.from('chat-media').upload(media_path,file,{upsert:false});
  if(error){alert('Erro ao enviar arquivo: '+error.message);return}
 }
 const row={
  sender_id:me.id,receiver_id:peer.id,
  body:body.trim()||null,media_path,media_type
 };
 const {error}=await sb.from('messages').insert(row);
 if(error){alert('Erro ao enviar mensagem: '+error.message);return}
 $('message').value='';
 await loadMessages();
}

$('send').onclick=()=>sendMessage($('message').value);
$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage($('message').value)}};
$('attach').onclick=()=>$('file').click();
$('file').onchange=async()=>{
 const f=$('file').files[0];
 if(f)await sendMessage('',f);
 $('file').value='';
};

$('record').onclick=async()=>{
 if(recorder&&recorder.state==='recording'){recorder.stop();$('record').textContent='🎙️';return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recorder=new MediaRecorder(stream);chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=async()=>{
   const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
   const f=new File([blob],'audio-'+Date.now()+'.webm',{type:blob.type});
   await sendMessage('',f);
   stream.getTracks().forEach(t=>t.stop());
  };
  recorder.start();$('record').textContent='⏹️';
 }catch(e){alert('Não foi possível gravar. Autorize o microfone e use HTTPS. '+e.message)}
};

$('wallpaper').onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 if(!f.type.startsWith('image/')){alert('Escolha uma imagem.');return}
 const url=URL.createObjectURL(f);
 $('messages').style.backgroundImage=`url("${url}")`;
};

$('logout').onclick=async()=>{
 await sb.auth.signOut();
 me=null;peer=null;screen('auth');
};

sb.auth.onAuthStateChange((event,session)=>{
 if(session?.user&&!me)setTimeout(()=>start(session.user),0);
 if(event==='PASSWORD_RECOVERY'){
  const p=prompt('Digite sua nova senha:');
  if(p&&p.length>=6)sb.auth.updateUser({password:p}).then(({error})=>alert(error?error.message:'Senha atualizada.'));
  else if(p)alert('Use pelo menos 6 caracteres.');
 }
});

const {data:{session}}=await sb.auth.getSession();
if(session?.user)await start(session.user);
</script>
</body>
</html>
