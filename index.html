<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XdsTalk - Login</title>
<style>
body{font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#222;padding:30px;border-radius:12px;width:300px;text-align:center}
input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;box-sizing:border-box}
button{width:100%;padding:10px;background:#00ff88;color:#000;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#00cc6a}
#msg{margin-top:15px;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>XdsTalk</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Senha (min 6 letras)">
<button id="btnCriar">Criar Conta</button>
<button id="btnEntrar">Entrar</button>
<div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8UtD8cNIAeqVeHbeZVDmxVzcEo9ZNUN4",
  authDomain: "xdstalk-c597b.firebaseapp.com",
  projectId: "xdstalk-c597b",
  storageBucket: "xdstalk-c597b.firebasestorage.app",
  messagingSenderId: "852750985311",
  appId: "1:852750985311:web:e659289d031e5f1a3153ea",
  measurementId: "G-WYM9LV0TXC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const msg = document.getElementById('msg');

document.getElementById('btnCriar').onclick = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    msg.style.color = '#00ff88';
    msg.innerText = 'Conta criada com sucesso!';
  } catch (e) {
    msg.style.color = '#ff5555';
    msg.innerText = e.code + ': ' + e.message;
  }
};

document.getElementById('btnEntrar').onclick = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    msg.style.color = '#00ff88';
    msg.innerText = 'Logado! Bem-vindo!';
    // Aqui depois você pode redirecionar pro chat
    // window.location.href = "chat.html"
  } catch (e) {
    msg.style.color = '#ff5555';
    msg.innerText = e.code + ': ' + e.message;
  }
};
</script>
</body>
</html>
