
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XdsTalk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top, #1a1a2e, #0f0f0f);color:#fff}
.container{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);padding:35px;border-radius:24px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{text-align:center;margin-bottom:25px}
.logo h1{margin:0;font-size:32px;font-weight:800;background:linear-gradient(90deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{margin:5px 0 0;color:#aaa;font-size:13px}
.input-group{position:relative;margin:12px 0}
.input-group input{width:100%;padding:14px 14px 14px 42px;background:#151515;border:1px solid #2a2a2a;border-radius:12px;color:#fff;outline:none;transition:.2s}
.input-group input:focus{border-color:#00ff88;box-shadow:0 0 0 3px rgba(0,255,136,0.15)}
.input-group span{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:.2s;margin-top:10px}
.btn-primary{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000}
.btn-secondary{background:#222;color:#fff;border:1px solid #333}
.link{color:#00ff88;font-size:12px;text-align:center;display:block;margin-top:15px;cursor:pointer;text-decoration:underline;background:none;border:none;width:100%}
#msg{text-align:center;margin-top:16px;font-size:13px;min-height:18px}
.success{color:#00ff88}
.error{color:#ff5a5a}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#555;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#222}
</style>
</head>
<body>
<div class="container">
<div class="logo"><h1>XdsTalk</h1><p>Converse com o mundo</p></div>
<div class="input-group"><span>📧</span><input type="email" id="email" placeholder="Seu email" value="Xds08@gmail.com"></div>
<div class="input-group"><span>🔒</span><input type="password" id="password" placeholder="Sua senha"></div>
<button class="btn btn-primary" id="btnCriar">Criar minha conta</button>
<div class="divider">ou</div>
<button class="btn btn-secondary" id="btnEntrar">Já tenho conta - Entrar</button>
<button class="link" id="btnReset">Esqueci minha senha</button>
<div id="msg"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyA8UtD8cNIAeqVeHbeZVDmxVzcEo9ZNUN4",
  authDomain: "xdstalk-c597b.firebaseapp.com",
  projectId: "xdstalk-c597b",
  storageBucket: "xdstalk-c597b.firebasestorage.app",
  messagingSenderId: "852750985311",
  appId: "1:852750985311:web:e659289d031e5f1a3153ea",
  measurementId: "G-WYM9LV0TXC"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const msg = document.getElementById('msg');
function showMsg(t,c){msg.className=c;msg.innerText=t}

document.getElementById('btnCriar').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  if(!email||!pass) return showMsg('Preencha email e senha','error');
  showMsg('Criando...','');
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    showMsg('✅ Conta criada! Agora clica em Entrar','success');
  } catch (e) {
    if(e.code=='auth/email-already-in-use') showMsg('Esse email já existe, clica em Entrar ou em Esqueci senha','error');
    else showMsg(e.message,'error');
  }
};
document.getElementById('btnEntrar').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  if(!email||!pass) return showMsg('Preencha email e senha','error');
  showMsg('Entrando...','');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showMsg('🚀 Logado! Bem-vindo!','success');
  } catch (e) {
    showMsg('Email ou senha errados. Tenta "Esqueci minha senha"','error');
  }
};
document.getElementById('btnReset').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if(!email) return showMsg('Digite seu email primeiro','error');
  showMsg('Enviando email de recuperação...','');
  try {
    await sendPasswordResetEmail(auth, email);
    showMsg('📧 Email enviado! Olha sua caixa de entrada do Gmail','success');
  } catch (e) {
    showMsg(e.message,'error');
  }
};
</script>
</body>
</html>
