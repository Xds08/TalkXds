
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="estilo.css">
<title>Talk Xds - Entrar</title>
</head>
<body class="login-body">
<div class="login-box">
  <h1>Talk <span>Xds</span></h1>
  <p>Crie sua conta</p>
  <input id="nome" placeholder="Seu nome">
  <input id="email" placeholder="Email" type="email">
  <input id="senha" placeholder="Senha" type="password">
  <button onclick="criar()">Criar conta</button>
  <button class="outline" onclick="entrar()">Já tenho conta - Entrar</button>
  <small>Estilo WhatsApp com cores Talk Xds</small>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDnjiFQtTu8A5vZ3NHEIl_zG9ylMKTv6b8",
  authDomain: "talkxds.firebaseapp.com",
  projectId: "talkxds",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.criar = async()=>{
  const email=document.getElementById('email').value;
  const senha=document.getElementById('senha').value;
  const nome=document.getElementById('nome').value;
  const cred = await createUserWithEmailAndPassword(auth,email,senha);
  await updateProfile(cred.user,{displayName:nome});
  location.href='Chats.html';
}
window.entrar = async()=>{
  const email=document.getElementById('email').value;
  const senha=document.getElementById('senha').value;
  await signInWithEmailAndPassword(auth,email,senha);
  location.href='Chats.html';
}
</script>
</body>
</html>
