<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XdsTalk</title>
<link rel="stylesheet" href="estilo.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD...",
  authDomain: "xdstalk.firebaseapp.com",
  projectId: "xdstalk",
  storageBucket: "xdstalk.firebasestorage.app",
  messagingSenderId: "...",
  appId: "..."
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.loginComGoogle = () => {
  signInWithPopup(auth, provider).catch(e => alert(e.message));
};

window.sair = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  const loginBox = document.getElementById("loginBox");
  const appBox = document.getElementById("appBox");
  if (user) {
    loginBox.classList.add("hidden");
    appBox.classList.remove("hidden");
    document.getElementById("foto").src = user.photoURL;
    document.getElementById("nome").innerText = user.displayName;
    document.getElementById("email").innerText = user.email;
  } else {
    loginBox.classList.remove("hidden");
    appBox.classList.add("hidden");
  }
});
</script>

<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0a0a12;font-family:Inter,system-ui;color:#fff}
.box{background:#141428;padding:28px;border-radius:22px;border:2px solid #222; width:100%; max-width:360px; text-align:center; box-shadow:0 20px 60px #0008}
h1{font-size:42px;margin:0;text-shadow:0 0 10px #ff0033,0 0 20px #0066ff}
.sub{color:#aaa;margin:8px 0 18px}
button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;cursor:pointer;transition:.2s}
button:active{transform:scale(.97)}
.entrar{background:linear-gradient(90deg,#ff0033,#0066ff);color:#fff}
.google{background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:10px}
.google img{width:20px}
.topo{display:flex;align-items:center;gap:12px;text-align:left}
.topo img{width:48px;height:48px;border-radius:50%;border:2px solid #ff0033}
.nome{font-weight:700}
.email{font-size:12px;color:#aaa}
.sair{margin-top:18px;background:#222;color:#fff}
.hidden{display:none}
#appBox .chat-area{margin-top:20px;background:#0f0f20;border-radius:16px;padding:12px;min-height:200px;border:1px solid #222}
</style>
</head>
<body>

<div id="loginBox" class="box">
  <h1>XdsTalk</h1>
  <div class="sub">Converse com seus amigos</div>
  <button class="google" onclick="loginComGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Entrar com Google
  </button>
</div>

<div id="appBox" class="box hidden">
  <div class="topo">
    <img id="foto" src="">
    <div>
      <div id="nome" class="nome"></div>
      <div id="email" class="email"></div>
    </div>
  </div>
  <div class="chat-area">
    <p style="color:#666;font-size:14px">Chat em breve aqui...</p>
  </div>
  <button class="sair" onclick="sair()">Sair</button>
</div>

</body>
</html>
