<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk Xds - Neon Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#06060f;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow:hidden;position:relative}
body::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,#7c4dff33,#ff00a022,transparent);top:-100px;left:-100px;filter:blur(40px)}
body::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,#ff00a033,#7c4dff22,transparent);bottom:-100px;right:-100px;filter:blur(40px)}
.card{width:100%;max-width:380px;background:rgba(17,17,31,0.9);border:1px solid #222;border-radius:24px;padding:32px 26px;position:relative;z-index:2;backdrop-filter:blur(20px);box-shadow:0 0 40px rgba(124,77,255,0.2), inset 0 1px 0 rgba(255,255,255,0.1)}
.logo{text-align:center;margin-bottom:30px}
.logo h1{font-size:36px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 20px #7c4dff}
.logo h1 span{background:linear-gradient(90deg,#7c4dff,#ff00a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.logo p{color:#666;font-size:12px;letter-spacing:3px;margin-top:6px;font-weight:700}
.input-group{margin-bottom:16px;position:relative}
.input-group label{color:#888;font-size:11px;letter-spacing:1px;font-weight:700;margin-bottom:6px;display:block}
.input-group input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid #2a2a4a;background:#0f0f1e;color:#fff;outline:none;font-size:14px;transition:0.3s}
.input-group input:focus{border-color:#7c4dff;box-shadow:0 0 15px rgba(124,77,255,0.4);background:#14142a}
.input-group input::placeholder{color:#444}
.btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(90deg,#7c4dff,#ff00a0);color:#fff;font-weight:800;font-size:14px;letter-spacing:1px;cursor:pointer;box-shadow:0 0 20px rgba(124,77,255,0.5);transition:0.2s;margin-top:10px}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(124,77,255,0.7)}
.btn:active{transform:translateY(0)}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#333;font-size:11px;letter-spacing:2px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#222}
.google{width:100%;padding:13px;border-radius:14px;border:1px solid #2a2a4a;background:#11111f;color:#fff;font-weight:700;display:flex;justify-content:center;align-items:center;gap:10px;cursor:pointer;transition:0.2s}
.google:hover{background:#1a1a2e;border-color:#7c4dff}
.toggle{text-align:center;margin-top:20px;color:#555;font-size:13px}
.toggle span{color:#7c4dff;font-weight:800;cursor:pointer}
.toggle span:hover{color:#ff00a0}
.hidden{display:none}
.error{background:#ff003322;border:1px solid #ff003355;color:#ff5a8a;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><h1>TALK <span>XDS</span></h1><p>NEON EDITION ⚡</p></div>
  <div id="error" class="error"></div>
  
  <div id="form-login">
    <div class="input-group"><label>EMAIL</label><input id="loginEmail" type="email" placeholder="seu@email.com"></div>
    <div class="input-group"><label>SENHA</label><input id="loginSenha" type="password" placeholder="••••••••"></div>
    <button id="btnLogin" class="btn">ENTRAR NO NEON ⚡</button>
    <div class="divider">OU</div>
    <button id="btnGoogle" class="google"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Continuar com Google</button>
    <div class="toggle">Não tem conta? <span id="irCadastro">Criar conta neon</span></div>
  </div>

  <div id="form-cadastro" class="hidden">
    <div class="input-group"><label>NOME</label><input id="cadNome" placeholder="Xds"></div>
    <div class="input-group"><label>EMAIL</label><input id="cadEmail" type="email" placeholder="seu@email.com"></div>
    <div class="input-group"><label>SENHA</label><input id="cadSenha" type="password" placeholder="Crie uma senha braba"></div>
    <button id="btnCadastro" class="btn">CRIAR CONTA ⚡</button>
    <div class="toggle">Já tem? <span id="irLogin">Voltar ao login</span></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = { apiKey:"AIzaSyDnjiFQtTu8A5vZ3NHEIl_zG9ylMKTv6b8", authDomain:"talkxds.firebaseapp.com", projectId:"talkxds", storageBucket:"talkxds.firebasestorage.app", messagingSenderId:"757013602887", appId:"1:757013602887:web:6627ff87623d698e7d8762" };
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const provider=new GoogleAuthProvider();
onAuthStateChanged(auth,u=>{if(u)location.href="chats.html"});
function showErr(t){const e=document.getElementById('error');e.style.display='block';e.textContent=t}
document.getElementById('irCadastro').onclick=()=>{document.getElementById('form-login').classList.add('hidden');document.getElementById('form-cadastro').classList.remove('hidden')};
document.getElementById('irLogin').onclick=()=>{document.getElementById('form-cadastro').classList.add('hidden');document.getElementById('form-login').classList.remove('hidden')};
document.getElementById('btnLogin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,loginEmail.value,loginSenha.value);location.href="chats.html"}catch(e){showErr(e.message)}};
document.getElementById('btnCadastro').onclick=async()=>{try{const c=await createUserWithEmailAndPassword(auth,cadEmail.value,cadSenha.value);await updateProfile(c.user,{displayName:cadNome.value});location.href="chats.html"}catch(e){showErr(e.message)}};
document.getElementById('btnGoogle').onclick=async()=>{try{await signInWithPopup(auth,provider);location.href="chats.html"}catch(e){showErr(e.message)}};
</script>
</body>
</html>
